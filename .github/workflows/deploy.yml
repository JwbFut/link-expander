name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue the next one behind it.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the link codec
        run: npm test

      - name: Assemble the static site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Every file the site serves. Add new ones here.
          cp index.html styles.css app.js lib.js favicon.svg _site/
          cp og.png robots.txt sitemap.xml _site/
          # Unknown paths (our generated links) must return the app, not a 404 page.
          cp index.html _site/404.html
          cp CNAME _site/CNAME
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
